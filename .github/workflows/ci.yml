name: CI/CD Pipeline for Credit Risk Model

on:
  push:
    branches: [ main, develop, task-* ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 black pytest pytest-cov
    
    - name: Run linter (flake8)
      run: |
        # Run flake8 on src directory
        flake8 src/ --max-line-length=120 --ignore=E203,W503 --count --show-source --statistics
        # Run flake8 on tests directory
        flake8 tests/ --max-line-length=120 --ignore=E203,W503 --count --show-source --statistics
    
    - name: Check formatting with black
      run: |
        black --check --line-length 100 src/ tests/ --diff
    
    - name: Run unit tests with pytest
      run: |
        pytest tests/ -v --cov=src --cov-report=xml --cov-report=term
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        token: ${{ secrets.CODECOV_TOKEN }}
    
    - name: Security scan with bandit
      run: |
        pip install bandit
        bandit -r src/ -ll -f json -o bandit_report.json || true

  build-docker:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: credit-risk-model:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Test Docker container
      run: |
        docker build -t credit-risk-model-test .
        docker run --rm credit-risk-model-test python -c "import src; print('Docker build successful')"

  deploy:
    runs-on: ubuntu-latest
    needs: [lint-and-test, build-docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Deploy to production
      run: |
        echo "========================================="
        echo "Deploying Credit Risk Model API"
        echo "========================================="
        echo "✅ Linting passed"
        echo "✅ Tests passed"
        echo "✅ Docker build passed"
        echo ""
        echo "Ready for deployment!"
        echo ""
        echo "To deploy manually:"
        echo "  docker-compose up -d"
